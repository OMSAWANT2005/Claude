name: Windows + Tailscale + Secure RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure secure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          # Negotiate/secure RDP transport.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 1 -Force

          # Allow RDP only through the Tailscale interface.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -InterfaceAlias 'Tailscale' `
            -Profile Any

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD GitHub Secret is not configured."
          }

          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser -Name 'RDP' `
              -Password $securePass `
              -AccountNeverExpires `
              -PasswordNeverExpires:$false
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          # RDP access without granting local Administrator rights.
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            throw "RDP user creation failed."
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $version = '1.82.0'
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-$version-amd64.msi"
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$installer`"", '/quiet', '/norestart' `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY GitHub Secret is not configured."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID" `
            --accept-dns=true

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
            $candidate = (& $ts ip -4 2>$null | Select-Object -First 1).Trim()

            if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
              $tsIP = $candidate
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw 'Tailscale IPv4 address was not assigned.'
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP service
        shell: powershell
        run: |
          Write-Host "Tailscale IPv4: $env:TAILSCALE_IP"

          $service = Get-Service -Name TermService
          if ($service.Status -ne 'Running') {
            throw 'Remote Desktop service is not running.'
          }

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            throw 'RDP TCP/3389 test failed.'
          }

          Write-Host 'RDP TCP connectivity test succeeded.'

      - name: Download and verify Downloads.bat
        shell: powershell
        env:
          DOWNLOADS_BAT_URL: ${{ secrets.DOWNLOADS_BAT_URL }}
          DOWNLOADS_BAT_SHA256: ${{ secrets.DOWNLOADS_BAT_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOWNLOADS_BAT_URL)) {
            throw 'DOWNLOADS_BAT_URL GitHub Secret is not configured.'
          }

          if ([string]::IsNullOrWhiteSpace($env:DOWNLOADS_BAT_SHA256)) {
            throw 'DOWNLOADS_BAT_SHA256 GitHub Secret is not configured.'
          }

          $startupPath = 'C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null

          $downloadPath = Join-Path $startupPath 'Downloads.bat'
          Invoke-WebRequest -Uri $env:DOWNLOADS_BAT_URL -OutFile $downloadPath

          $actual = (Get-FileHash -Path $downloadPath -Algorithm SHA256).Hash.ToLower()
          $expected = $env:DOWNLOADS_BAT_SHA256.Trim().ToLower()

          if ($actual -ne $expected) {
            Remove-Item $downloadPath -Force
            throw "Downloads.bat SHA-256 verification failed."
          }

          Write-Host 'Downloads.bat SHA-256 verified.'

          # Execute only after successful hash verification.
          Start-Process -FilePath 'cmd.exe' `
            -ArgumentList '/c', "`"$downloadPath`"" `
            -Wait `
            -NoNewWindow

      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host ''
          Write-Host '=== SECURE RDP ACCESS ==='
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Password: stored in GitHub Secret RDP_PASSWORD'
          Write-Host '========================='
          Write-Host ''

          while ($true) {
            Write-Host "[$(Get-Date)] Secure RDP active."
            Start-Sleep -Seconds 300
          }
          
